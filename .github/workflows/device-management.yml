name: VikaTech device-management checks

on:
  pull_request:
    paths:
      - "esp32.cpp"
      - "supabase/**"
      - "src/app/admin/**"
      - "src/app/api/admin/devices/**"
      - "src/lib/**"
      - "src/components/**"
      - "src/hooks/**"
      - "src/app/api/esp32/**"
      - "tests/**"
      - "next.config.*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/device-management.yml"
  push:
    branches:
      - main
      - feat/device-fleet-remote-management
      - fix/device-management-hardening-final

permissions:
  contents: read

jobs:
  contract-tests:
    name: Device-agent and encryption contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:device-management

  next-production-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    env:
      # Non-production placeholders are enough for compile-time imports.
      # Never use real customer or Supabase production credentials in CI.
      NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-anon-key-not-for-deployment
      SUPABASE_SERVICE_ROLE_KEY: build-only-service-role-placeholder-not-for-deployment
      PROVISIONING_ENCRYPTION_KEY: build-only-encryption-key-placeholder-not-for-deployment-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  esp32-firmware-compile:
    name: Compile ESP32 device-agent firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and ArduinoJson
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "WebSockets@2.7.0"
      - name: Compile the repository firmware source
        shell: bash
        run: |
          set -euo pipefail
          sketch_dir="$RUNNER_TEMP/VikaTechESP32"
          mkdir -p "$sketch_dir"
          printf '#include "%s/esp32.cpp"\n' "$GITHUB_WORKSPACE" > "$sketch_dir/VikaTechESP32.ino"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings all \
            --build-path "$RUNNER_TEMP/VikaTechESP32-build" \
            "$sketch_dir"
